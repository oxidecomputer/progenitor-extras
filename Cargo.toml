[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oxidecomputer/progenitor-extras"
rust-version = "1.88"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(doc_cfg)"] }

[workspace.dependencies]
backon = { version = "1.6.0", default-features = false, features = ["std"] }
http = "1"
httptest = "0.16.4"
progenitor = "0.15.1"
progenitor-client = "0.15.1"
reqwest = { version = "0.13.2", default-features = false }
serde = "1.0.228"
serde_json = "1.0.149"
tokio = "1.49.0"

# Patches for local development.
[patch.crates-io]
# progenitor-client = { path = "../progenitor/progenitor-client" }
