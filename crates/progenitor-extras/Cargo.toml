[package]
name = "progenitor-extras"
version = "0.2.0"
description = "Extra functionality for the Progenitor OpenAPI client generator"
readme = "README.md"
documentation = "https://docs.rs/progenitor-extras"
repository.workspace = true
keywords = ["progenitor", "openapi", "retry", "slog"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg=doc_cfg"]

[lints]
workspace = true

[package.metadata.cargo-sync-rdme.badge.badges]
license = true
crates-io = true
docs-rs = true
rust-version = true

[dependencies]
backon = { workspace = true, optional = true }
http = { workspace = true, optional = true }
progenitor-client.workspace = true
reqwest = { workspace = true, optional = true }
slog = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }

[dev-dependencies]
http.workspace = true
httptest.workspace = true
progenitor.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "test-util"] }

[features]
retry = ["dep:backon", "dep:http", "dep:tokio"]
slog = ["dep:reqwest", "dep:slog"]

[package.metadata.release]
pre-release-replacements = [
    { file="../../CHANGELOG.md", search="Unreleased", replace="[{{version}}]", min=1 },
    { file="../../CHANGELOG.md", search="ReleaseDate", replace="{{date}}", min=1 },
    { file="../../CHANGELOG.md", search="<!-- next-header -->", replace="<!-- next-header -->\n## Unreleased - ReleaseDate\n", exactly=1 },
    { file="../../CHANGELOG.md", search="<!-- next-url -->", replace="<!-- next-url -->\n[{{version}}]: https://github.com/oxidecomputer/progenitor-extras/releases/tag/progenitor-extras-{{version}}", exactly=1},
]
